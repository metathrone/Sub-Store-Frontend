name: Sync Upstream

on:
  schedule:
    # 每天 UTC 03:00 (北京时间 11:00) 自动检查并同步上游最新代码
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Master from Upstream
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/sub-store-org/Sub-Store-Front-End.git
          git fetch upstream master
          if [ "$(git rev-list HEAD..upstream/master --count)" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-commit --no-ff -X theirs upstream/master
          git checkout HEAD -- .github/workflows/main.yml
          git commit -m "chore(sync): merge upstream/master (keep custom main.yml)"
          git push origin master
